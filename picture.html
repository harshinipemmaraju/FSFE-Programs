<!DOCTYPE html>
<html>
    <head>
        <title>Simple CSS Example</title>
        <style>
            /* Selector: h1 */
            h1 {
                /* Property: color, Value: blue */
                color: blue;
                /*Property: text-align, Value: center */
                text-align:center;
            }
            /* Selector: p */
            p {
                /* Property: color, Value: green*/
                color: green;
                /* Property: font-size, Value: 18px */
                font-size: 18px;
            }
            /* Class selector: .box */
            .box {
                /* Property: background-color, Value: lightyellow */
                background-color: lightyellow;
                /* Property: padding, Value: 20px*/
                padding: 20px;
                /* Property: border, Value: 2px solid red */
                border: 2px solid red;
            }
        </style>
    </head>

    <body>
        <h1>Welcome to CSS</h1>
        <p>This is a simple paragraph styled using CSS.</p>
        <div class="box">
            <center>This box uses a class selector</center>
        </div>
    </body>
</html>
